[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-demo-automation"
version = "0.1.0"
description = "Compile synchronized game demonstrations into MaaFramework task drafts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.8", "pynput>=1.7"]
maa = ["maafw>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
game-demo = "game_demo_automation.cli:main"
game-demo-simulator = "game_demo_automation.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_demo_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

